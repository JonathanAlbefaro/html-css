<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form> <!--Todo formulário deve estar dentro dessa tag form-->
        <p>Nome: <input type="text" name="Nome" id=""></p> 
        <p>Sobrenome: <input type="text" name="Sobrenome" id=""></p>
        <p><input type="submit" value="Enviar"></p>

        <!--inupt: serve para criar campos interativos em formulários. No nosso caso, utilizamos type=text, permitindo que possamos inserir informações no formluário. Type=submit serve pra criar um botão de enviar.-->
    </form>
</body>
</html>
