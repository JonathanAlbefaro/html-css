<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>

    <style>
        iframe{
            width: 400px;
            height: 400px; /*css tem prioridade no iframe. O primeiro iframe tem 500px mas seu site vai priorizar usar os 400px que estão nesse css.*/
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        

        <!--Tamanho padrão 300x150-->
        <iframe src="https://fonts.google.com/" frameborder="0" height="500px" scolling="auto"> <!--scolling="auto" cria barra de rolagem somente se o conteúdo do iframe utrapassar a altura padrão dele.-->

            <a href="https://fonts.google.com/" target="_blank">Google fonts</a> <!-- usei esse link em baixo do iframe, para caso o navegador do celular do usuário não for conpativel com iframe, esse link irá subtituir  ele.-->
        </iframe>

        para aprender programar</p>

        <p>O site do <iframe src="https://google.com/" frameborder="0"></iframe> Google</p>
</body>
</html>
