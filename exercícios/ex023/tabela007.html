<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 500px;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
        }

        col.cnome{
            background-color: aqua;
        }

        col.cgrupo{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <table>
        <colgroup> <!--Serve para agruparmos culas da tabela para facilitar o agrupamento-->

            <col class="cnome"> <!--Cada 'col' representa uma coluna. Ou seja, se na sua tabela tiver 4 colunas, você tera que colocar quatro col no seu colgroup. Mas tem uma excessão que explicarei na linha abaixo.-->

            <col class="cgrupo" span="2"> <!--Quando tiver span="2" ou um valor acima de dois, significa que esse col irá representar mais de uma coluna na sua tabela e oque você alterar nele também será alterado na outa coluna que ele representa. No nosso caso, ele está representando duas, então nesse caso, só é necessário 3 col nesse colgroup--> 
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
