<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        } 
        
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse; /*Deixa a borda de cada conteúdo html grudado com outro.*/
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            vertical-align: top; /*Deixa o conteúdo em cima, também tem bottom e middle*/
        }

        .numero{
            text-align: right;
        }

      
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
     HIERARQUIA DE TABELAS (simples)
     table (table)= tabela
      table row (tr)= linha de tabela
       table header (th) = cabeçalho de tabela
        tablem date (td)= dados de tabelas-->

    <table>
        <tr> <!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>       
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="alerta">B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
