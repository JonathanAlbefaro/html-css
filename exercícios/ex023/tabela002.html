<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        caption{
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }

        table{
            width: 500px;
            border-collapse: collapse;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot{
            background-color: gray;
            color: white;
        }

        tbody > tr:nth-child(odd){ /*odd significa ímpar, ou seja a primeira linha será lightgray, já a próxima não e depois volta a ser lightgray e assim por diante. Você também pode configurar essa pseudo-classe com 2n, que básicamente ele diz pro css pra ele deixar o segundo item da tabela lighgray e assim por diante. Se fosse 3n ou mais seguiria a mesma lógica do 2n*/
            background-color: white;
        }

         tbody > tr:nth-child(even){ /*even significa par, ou seja a segunda linha será yellow, já a próxima não e depois volta a ser yellow e assim por diante. Você também pode configurar essa pseudo-classe com 2n, que básicamente ele diz pro css pra ele deixar o segundo item da tabela lighgray e assim por diante. Se fosse 3n ou mais seguiria a mesma lógica do 2n*/
            background-color: lightgray;
        }

        td.num{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Usando tabelas grandes</h1>
    <!--
    ANATOMIA PARA TABELAS GRANDES
    TABLE
     CAPTION
        THEAD
         TR, TD, TH
        TBODY
         TR, TD, TH
        TFOOT
         TR, TD, TH
    -->
         <table>
            <caption>População das Unidades Federativas</caption>
            <thead>
                <tr>
                    <th>Estado</th>
                    <th style="width: 50px;">População</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>São Paulo</td>
                    <td class="num">45 919 049</td>
                </tr>
               <tr>
                 <td>Minas Gerais</td>
                  <td class="num">21 168 791</td>
               </tr>
               <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 264 943</td>
               </tr>
                 <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 264 943</td>
               </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th>Total de Habitantes</th>
                    <td class="num"><strong>0000</strong></td>
                </tr>
            </tfoot>
         </table>
</body>
</html>
