<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 300px;
            border-collapse: collapse;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclando Células</h1>

    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td> <!--Expande a coluna da tabela, ex: apagamos a coluna C, e para não ficar um espaço vago, usamos a a tag colspan="2" para que a coluna B se expanda por duas colunas.-->

        </tr>
        <tr>
            <td rowspan="3">D</td><!--Expande as linhas da tabela, ex: apagamos as duas colunas abaixo da D, e para não ficar um espaço vago, usamos a a tag rowspan="3" que básicamente faz com que sua coluna ocupe o espaço das linhas de baixo de acordo com o valor que estiver nele, lembrando que cada dado de uma coluna (td) que estiver dentro do mesmo 'tr' representam a mesma linha, por tanto ele ocupa o espaço de baixo das linhas das tabelas caso ela estiver vago.-->
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>
        <tr>
          
            <td>H</td>
            
        </tr>
        <tr>  
            <td colspan="2">L</td>
        </tr>
    </table>
</body>
</html>
