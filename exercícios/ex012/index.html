<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando Vídeos no HTML</title>
</head>
<body>
    <h1>Usando Vídeos</h1>
    <video src="midia/meu-video-convertido.Mp4.mp4" width="600" controls></video>
    <video width="600" poster="midia/meu.capa.png" controls>
        <source src="midia/meu-video-convertido.Mp4.mp4" type="video/mp4">
        <source src="midia/meu-video-convertido.M4v.mp4" type="video/mp4">
        <source src="midia/meu-video-convertido.webm.mp4" type="video/mp4">
        <source src="midia/meu-video-convertido.ogv.mp4" type="video/mp4">
    </video>

    <h1>Inserindo vídeos do youtube</h1>
<iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=_fLgj_UfWyWMqINv" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
